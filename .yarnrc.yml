nodeLinker: node-modules

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0

# Vite+ installs Vite as `vite` at its own version (1.x), which is Vite 8 inside: Vite plugins (and Vite+'s own Vitest)
# ask for `vite` ^8, and Yarn warns on every install that 1.x doesn't satisfy it. Those two lines are dropped; any other
# peer problem still shows as a ✘ in `yarn explain peer-requirements`
logFilters:
  - pattern: 'vite is listed by your project with version'
    level: discard
  - text: 'Some peer dependencies are incorrectly met by dependencies; run yarn explain peer-requirements for details.'
    level: discard

yarnPath: .yarn/releases/yarn-4.18.1.cjs
